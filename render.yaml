services:
  - type: web
    name: apna-shop-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Neon connection string: postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Auto-generated secure value, stable across deploys
      - key: JWT_SECRET
        generateValue: true
      # Set to your Vercel frontend URL once deployed (comma-separated for multiple)
      - key: CORS_ORIGINS
        sync: false
      # Set to "update" for the FIRST deploy so tables are created on Neon,
      # then change back to "none" to keep the schema stable.
      - key: DDL_AUTO
        value: none
