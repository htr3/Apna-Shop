spring.application.name=apna-shop-backend
server.port=${PORT:5000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/shopkeeper_insights}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5000}

# === Actuator (monitoring) ===
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,env,loggers,httpexchanges}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=${spring.application.name}
info.app.description=Apna Shop Spring Boot backend

# === Logging ===
logging.level.root=INFO
logging.level.com.apnashop=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE:logs/apna-shop.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
